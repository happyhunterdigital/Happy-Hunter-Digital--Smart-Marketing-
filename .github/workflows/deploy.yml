name: System - Build, Audit & Deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies & Audit Supply Chain
        run: |
          npm ci
          npm audit --audit-level=high

      - name: Build Frontend Application
        run: npm run build

      - name: Install Backend Dependencies & Audit Supply Chain
        run: |
          cd functions
          npm ci
          npm audit --audit-level=high

      - name: Build Backend Cloud Functions
        run: |
          cd functions
          npm run build

      - name: Deploy Architecture to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: happy-hunter-systems
          channelId: live
