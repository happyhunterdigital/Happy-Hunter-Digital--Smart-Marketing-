name: System - Build, Audit & Deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        run: npm install

      - name: Run Supply Chain Audit (Frontend)
        run: npm audit --audit-level=high || true

      - name: Build Frontend Application
        run: npm run build

      - name: Install Backend Dependencies
        run: |
          cd functions
          npm install

      - name: Run Supply Chain Audit (Backend)
        run: |
          cd functions
          npm audit --audit-level=high || true

      - name: Build Backend Cloud Functions
        run: |
          cd functions
          npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Complete Architecture to Firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-sa.json
        run: |
          if [ -n "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ]; then
            echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/firebase-sa.json
          fi
          firebase deploy --non-interactive --force
