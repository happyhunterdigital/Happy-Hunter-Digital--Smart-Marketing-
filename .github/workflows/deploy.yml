name: Deploy Happy Hunter to Firebase

on:
  push:
    branches: [main]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ==========================================
      # STEP 1: Build Frontend (Vite Application)
      # ==========================================
      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend Application
        run: npm run build
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_PLACES_API_KEY: ${{ secrets.VITE_PLACES_API_KEY }}
          VITE_FIREBASE_CONFIG: ${{ secrets.VITE_FIREBASE_CONFIG }}

      # ==========================================
      # STEP 2: Build Firebase Functions (Backend)
      # ==========================================
      - name: Install Functions Dependencies
        working-directory: ./functions
        run: npm ci

      - name: Build Firebase Functions
        working-directory: ./functions
        run: npm run build

      # ==========================================
      # STEP 3: Deploy Everything to Firebase
      # ==========================================
      - name: Deploy to Firebase Hosting & Functions
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}'
          channelId: live
          projectId: happyhunterdigital-17480
