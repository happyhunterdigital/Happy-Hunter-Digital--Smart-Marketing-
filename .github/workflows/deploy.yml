name: System - Build, Audit & Deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        run: npm install

      - name: Run Supply Chain Audit (Frontend)
        run: npm audit --audit-level=high || true

      - name: Build Frontend Application
        # INJECTION: Passing the Vault Secrets to Vite during compilation
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
        run: npm run build

      - name: Install Backend Dependencies
        run: |
          cd functions
          npm install

      - name: Run Supply Chain Audit (Backend)
        run: |
          cd functions
          npm audit --audit-level=high || true

      - name: Build Backend Cloud Functions
        run: |
          cd functions
          npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Complete Architecture to Firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-sa.json
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_KEY" ]; then
            echo "CRITICAL ERROR: FIREBASE_SERVICE_ACCOUNT_KEY secret is missing or empty."
            exit 1
          fi

          echo "$FIREBASE_SERVICE_ACCOUNT_KEY" > /tmp/firebase-sa.json
          
          firebase deploy \
            --project happy-hunter-systems \
            --non-interactive \
            --force
