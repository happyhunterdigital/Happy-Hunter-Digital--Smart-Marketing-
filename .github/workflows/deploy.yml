name: Deploy Happy Hunter 2.0

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  # Force case sensitivity for Linux builds
  FORCE_CASE_SENSITIVITY: true
  NODE_ENV: production

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    
    steps:
      - name: 🔐 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Ensure consistent line endings
          persist-credentials: false

      - name: 🔧 Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: 🛡️ Security Audit
        run: npm audit --audit-level=moderate

      - name: 📦 Install Dependencies (Clean)
        run: |
          rm -rf node_modules package-lock.json
          npm ci --prefer-offline --no-audit

      - name: 🔍 Lint & Type Check
        run: |
          npm run lint --if-present
          npx tsc --noEmit

      - name: 🏗️ Build Application (Case-Sensitive)
        run: npm run build
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_PLACES_API_KEY: ${{ secrets.VITE_PLACES_API_KEY }}
          VITE_FIREBASE_CONFIG: ${{ secrets.VITE_FIREBASE_CONFIG }}
          # Force Unix paths in build
          FORCE_UNIX_PATHS: 1

      - name: 🔒 Verify Build Integrity
        run: |
          test -d dist || (echo "❌ Build failed - no dist folder" && exit 1)
          test -f dist/index.html || (echo "❌ Missing index.html" && exit 1)

      - name: 📤 Setup Pages
        uses: actions/configure-pages@v5

      - name: 📦 Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 1

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-functions:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: 🔥 Deploy Firebase Functions
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only functions
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
