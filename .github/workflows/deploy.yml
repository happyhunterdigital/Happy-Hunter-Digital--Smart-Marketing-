# .github/workflows/deploy.yml
name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Debug Environment
        run: |
          echo "Node version: $(node -v)"
          echo "NPM version: $(npm -v)"
          echo "Directory contents:"
          ls -la
          echo "Checking for package.json:"
          cat package.json | head -20
      
      - name: Install Dependencies (with fallback)
        run: |
          if [ -f package-lock.json ]; then
            echo "Using npm ci with existing lock file"
            npm ci
          else
            echo "No lock file found, running npm install"
            npm install
          fi
        continue-on-error: false
      
      - name: Verify TypeScript Config
        run: |
          echo "tsconfig.json contents:"
          cat tsconfig.json
          echo "Checking for vite.config.ts:"
          ls -la vite.config.ts || echo "vite.config.ts not found"
      
      - name: Build Production (with debug)
        run: |
          echo "Starting build process..."
          npm run build 2>&1 | tee build.log
          echo "Build exit code: ${PIPESTATUS[0]}"
          exit ${PIPESTATUS[0]}
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_PLACES_API_KEY: ${{ secrets.VITE_PLACES_API_KEY }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          CI: true
      
      - name: Upload Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            npm-debug.log
            /home/runner/.npm/_logs/*.log
      
      - name: Check Build Output
        run: |
          echo "Dist directory contents:"
          ls -la dist/ || echo "No dist directory found"
          echo "Index.html exists:"
          test -f dist/index.html && echo "YES" || echo "NO"
      
      - name: Deploy to Firebase
        if: success()
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          channelId: live
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
