name: System - Build, Audit & Deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm install

      - name: Run Supply Chain Audit (Frontend)
        run: npm audit || true

      - name: Build Frontend Application
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
        run: npm run build

      - name: Audit Build Artifacts
        run: |
          echo "Checking for secrets in dist/ ..."
          if grep -r "FIREBASE_API_KEY\|POSTHOG_KEY\|sk_live_\|pk_live_" dist/ --include="*.js" --include="*.json" 2>/dev/null | grep -v "firebaseapp\|firebase.google"; then
            echo "❌ ERROR: Secrets detected in build artifacts"
            exit 1
          fi
          
          echo "Checking for sourcemaps ..."
          if find dist -name "*.map" | grep -q .; then
            echo "❌ ERROR: Sourcemaps found in dist/"
            exit 1
          fi
          
          echo "✓ Build artifacts verified - no secrets or sourcemaps"

      - name: Install Backend Dependencies
        run: |
          cd functions
          npm install

      - name: Run Supply Chain Audit (Backend)
        run: |
          cd functions
          npm audit || true

      - name: Build Backend Cloud Functions
        run: |
          cd functions
          npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Validate Firebase Configuration
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_KEY" ]; then
            echo "❌ CRITICAL: FIREBASE_SERVICE_ACCOUNT_KEY secret is missing"
            exit 1
          fi
          
          # Validate JSON structure
          echo "$FIREBASE_SERVICE_ACCOUNT_KEY" | jq . > /dev/null || {
            echo "❌ ERROR: Invalid Firebase service account JSON"
            exit 1
          }
          
          echo "$FIREBASE_SERVICE_ACCOUNT_KEY" > /tmp/firebase-sa.json
          echo "✓ Firebase credentials validated"

      - name: Validate Firestore Rules Syntax
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-sa.json
        run: firebase deploy --only firestore:rules --dry-run --project happy-hunter-systems || exit 1

      - name: Validate Storage Rules Syntax
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-sa.json
        run: firebase deploy --only storage --dry-run --project happy-hunter-systems || exit 1

      - name: Deploy Complete Architecture to Firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-sa.json
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_KEY" > /tmp/firebase-sa.json
          
          echo "Deploying to Firebase..."
          firebase deploy \
            --project happy-hunter-systems \
            --non-interactive \
            --force
          
          echo "✓ Deployment completed"

      - name: Verify Firebase Deployment
        run: |
          echo "Verifying Firebase project..."
          firebase hosting:channel:list --project happy-hunter-systems || exit 1
          
          echo "Checking live site..."
          sleep 5 # Allow propagation
          curl -f -s -I https://happyhunterdigital.com/index.html | head -1 || {
            echo "⚠ Live site check failed - may need additional time to propagate"
          }
          
          echo "✓ Deployment verified"

      - name: Post-Deployment Security Check
        run: |
          echo "Verifying security headers..."
          HEADERS=$(curl -s -I https://happyhunterdigital.com/ | grep -i "Strict-Transport-Security\|Content-Security-Policy\|X-Content-Type-Options" | wc -l)
          if [ $HEADERS -lt 3 ]; then
            echo "⚠ WARNING: Some security headers may not be configured"
          else
            echo "✓ Security headers verified"
          fi

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/
          retention-days: 7

      - name: Deployment Notification
        if: success()
        run: |
          echo "✅ Deployment successful"
          echo "Project: happy-hunter-systems"
          echo "URL: https://happyhunterdigital.com"
          echo "Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

      - name: Deployment Failure Notification
        if: failure()
        run: |
          echo "❌ Deployment failed"
          echo "Check logs for details"
          exit 1
