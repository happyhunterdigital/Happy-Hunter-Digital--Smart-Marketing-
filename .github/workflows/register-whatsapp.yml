name: Force WhatsApp API Registration
on:
  workflow_dispatch:

jobs:
  register-number:
    runs-on: ubuntu-latest
    steps:
      - name: Send Registration Request to Meta
        run: |
          curl -X POST "https://graph.facebook.com/v19.0/964822430057075/register" \
          -H "Authorization: Bearer ${{ secrets.META_SYSTEM_TOKEN }}" \
          -d "messaging_product=whatsapp" \
          -d "pin=${{ secrets.META_WA_PIN }}"
