name: Force WABA Webhook Subscription
on:
  workflow_dispatch:

jobs:
  subscribe-waba:
    runs-on: ubuntu-latest
    steps:
      - name: Subscribe App to WABA
        run: |
          curl -X POST "https://graph.facebook.com/v19.0/1624191862338534/subscribed_apps" \
          -H "Authorization: Bearer ${{ secrets.META_SYSTEM_TOKEN }}"
