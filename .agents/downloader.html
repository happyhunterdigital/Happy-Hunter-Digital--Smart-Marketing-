<!DOCTYPE html>
<html>
<head>
  <title>Cloudflare Skills JSONP Downloader</title>
</head>
<body>
  <h1>Downloading Cloudflare Skills via JSONP...</h1>
  <div id="status">Starting...</div>
  <pre id="log"></pre>
  <h2>Results JSON:</h2>
  <textarea id="download-results" rows="30" cols="100" style="width: 100%; max-width: 1000px; font-family: monospace;"></textarea>

  <script>
    const logEl = document.getElementById('log');
    const statusEl = document.getElementById('status');
    const resultsEl = document.getElementById('download-results');

    function log(msg) {
      logEl.textContent += msg + '\n';
      console.log(msg);
    }

    const skills = [
      'agents-sdk',
      'cloudflare-email-service',
      'cloudflare-one-migrations',
      'cloudflare-one',
      'cloudflare',
      'durable-objects',
      'sandbox-sdk',
      'turnstile-spin',
      'web-perf',
      'workers-best-practices',
      'wrangler'
    ];

    const results = {};
    let currentIndex = 0;

    function decodeBase64Utf8(str) {
      try {
        return decodeURIComponent(escape(atob(str.replace(/\s/g, ''))));
      } catch (e) {
        log('Error decoding UTF-8 base64, falling back to standard atob: ' + e.message);
        return atob(str.replace(/\s/g, ''));
      }
    }

    window.handleGitHubResponse = function(response) {
      if (response.meta && response.meta.status !== 200) {
        log(`API error: status ${response.meta.status}`);
        next();
        return;
      }
      
      const data = response.data;
      if (data && data.path && data.content) {
        log(`Successfully fetched and decoded ${data.path}`);
        const decoded = decodeBase64Utf8(data.content);
        results[data.path] = decoded;
      } else {
        log(`Invalid response structure for index ${currentIndex}`);
      }
      
      next();
    };

    function fetchNext() {
      if (currentIndex < skills.length) {
        const skill = skills[currentIndex];
        log(`Fetching ${skill}...`);
        const script = document.createElement('script');
        script.src = `https://api.github.com/repos/cloudflare/skills/contents/skills/${skill}/SKILL.md?callback=handleGitHubResponse`;
        document.body.appendChild(script);
      } else if (currentIndex === skills.length) {
        // Also fetch rules/workers.mdc
        log(`Fetching rules/workers.mdc...`);
        const script = document.createElement('script');
        script.src = `https://api.github.com/repos/cloudflare/skills/contents/rules/workers.mdc?callback=handleGitHubResponse`;
        document.body.appendChild(script);
      } else {
        // All done!
        resultsEl.value = JSON.stringify(results);
        statusEl.textContent = 'Done';
        log('All downloads completed!');
      }
    }

    function next() {
      currentIndex++;
      fetchNext();
    }

    // Start
    fetchNext();
  </script>
</body>
</html>
