<!--
  ══════════════════════════════════════════════════════════════════
  FILE: public/index.html — CSP Meta Tag Fix
  ISSUE: Google Auth (auth/internal-error) caused by missing
         apis.google.com and accounts.google.com in CSP directives.
  INSTRUCTIONS:
  Locate your existing <meta http-equiv="Content-Security-Policy">
  tag in public/index.html and REPLACE it with the block below.
  If you don't have this meta tag, paste it inside your <head>.
  ══════════════════════════════════════════════════════════════════
-->

<!--
  ─── BEFORE (what you likely have — BROKEN) ─────────────────────
  <meta
    http-equiv="Content-Security-Policy"
    content="
      script-src 'self' 'unsafe-inline' 'unsafe-eval'
        https://*.firebaseapp.com
        https://*.googleapis.com
        https://*.gstatic.com;
    "
  />

  WHY IT BREAKS:
  - apis.google.com is NOT *.googleapis.com — it's a separate domain.
  - accounts.google.com is also not covered, blocking the OAuth popup iframe.
  - script-src-elem is unset so the browser falls back to script-src,
    which rejects the Google Identity Services loader script.
  - Result: Firebase Auth cannot initialise → auth/internal-error →
    Firestore snapshot listener fires unauthenticated → permission-denied.

  ─── AFTER (replace with this — FIXED) ──────────────────────────
-->

<meta
  http-equiv="Content-Security-Policy"
  content="
    default-src 'self';

    script-src
      'self'
      'unsafe-inline'
      'unsafe-eval'
      https://apis.google.com
      https://accounts.google.com
      https://*.firebaseapp.com
      https://*.googleapis.com
      https://*.gstatic.com
      https://cdnjs.cloudflare.com;

    script-src-elem
      'self'
      'unsafe-inline'
      https://apis.google.com
      https://accounts.google.com
      https://*.firebaseapp.com
      https://*.googleapis.com
      https://*.gstatic.com
      https://cdnjs.cloudflare.com;

    frame-src
      'self'
      https://accounts.google.com
      https://*.firebaseapp.com
      https://*.web.app;

    connect-src
      'self'
      https://*.googleapis.com
      https://*.firebaseio.com
      wss://*.firebaseio.com
      https://identitytoolkit.googleapis.com
      https://securetoken.googleapis.com
      https://firebase.googleapis.com;

    img-src
      'self'
      data:
      blob:
      https://*.googleusercontent.com
      https://*.gstatic.com;

    style-src
      'self'
      'unsafe-inline'
      https://fonts.googleapis.com;

    font-src
      'self'
      https://fonts.gstatic.com;

    object-src 'none';
    base-uri 'self';
  "
/>

<!--
  ══════════════════════════════════════════════════════════════════
  NOTE: If you're setting CSP via HTTP headers on your server or
  CDN (Netlify, Vercel, Cloudflare Pages, etc.) instead of a meta
  tag, apply the same directives in your _headers file or
  server configuration. Meta tag CSP cannot set report-uri or
  report-to, so HTTP headers are always the stronger option.

  For Netlify (_headers file in /public):
  
  /*
    Content-Security-Policy: default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://apis.google.com https://accounts.google.com https://*.firebaseapp.com https://*.googleapis.com https://*.gstatic.com https://cdnjs.cloudflare.com; script-src-elem 'self' 'unsafe-inline' https://apis.google.com https://accounts.google.com https://*.firebaseapp.com https://*.googleapis.com https://*.gstatic.com https://cdnjs.cloudflare.com; frame-src 'self' https://accounts.google.com https://*.firebaseapp.com https://*.web.app; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; img-src 'self' data: blob: https://*.googleusercontent.com https://*.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; object-src 'none';

  ══════════════════════════════════════════════════════════════════
-->
